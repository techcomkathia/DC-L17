<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>

<!-- crie um pequeno formulário com os seguintes campos:
 nome - text
 email - email
 data de nascimento - date
 horario de agendamento - time
 endereço - text
 botão de envio - submit
-->

<form action="">
    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="digite seu nome aqui">
    <br>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="digite seu email aqui">
    <br>
    <label for="nascimento">Data de Nascimento</label>
    <input type="date" id="nascimento" placeholder="data de nascimento aqui">
    <br>
    <label for="horario">Horario</label>
    <input type="time" id="horario">
    <br>
    <label for="">Endereço</label>
    <input type="text" placeholder="Rua x, Bairro y, Nº 0. Cidade -UF">
    <br>
    <input type="submit" value="Enviar">
</form>


    
</body>
</html>
