<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <label for="nome">Nome</label>
        <input type="text" name="" id="nome">
        <br>
        <label for="senha">Senha</label>
        <input type="password" name="" id="senha">
        <br>

        <label for="">Pergunta para o grupo de opções abaixo</label>
        <br>
        <!-- grupo de opções que só pode ser selecionada 1 dentre as muitas -->
         <input type="radio" name="grupo" id="um" value="opção 1" >
         <label for="um">opção 1</label>

         <input type="radio" name="grupo" id="dois" value="opção 2">
         <label for="dois">opção 2</label>

         <input type="radio" name="grupo" id="tres" value="opção 3">
         <label for="tres">opção 3</label>

         <input type="radio" name="grupo" id="quatro" value="opção 4">
         <label for="quatro">opção 4</label>

        <br>

        <label for="">Pergunta para o grupo de opções abaixo</label>
        <br>
        <!-- grupo de opções que só pode ser selecionada 1 ou mais opções -->
         <input type="checkbox" name="grupo2" id="um1" value="opção 1" >
         <label for="um1">opção 1</label>


         <input type="checkbox" name="grupo2" id="dois2" value="opção 2">
         <label for="dois2">opção 2</label>



         <input type="checkbox" name="grupo2" id="tres3" value="opção 3">
         <label for="tres3">opção 3</label>

         
         <input type="checkbox" name="grupo2" id="quatro4" value="opção 4">
         <label for="quatro4">opção 4</label>

        <br>
        <!-- select é utilizado como "menu suspenso" para exibir e permitir a seleção quando existem muitas opções -->

        <label for="estado">Estado</label>
        <select name="" id="estado">
            <!-- disabled desabilita a opção -->
             <!-- defalt seleciona a primeira opção -->
            <option value="padrão" selected>padrão</option>
             <option value="AM">AM</option>
            <option value="PB">PB</option>
            <option value="RN">RN</option>
            <option value="CE">CE</option>
            <option value="PE" disabled>PE</option>
        </select>

        <br>

        <label for="campoTexto">Faça seu comentário</label>
        <textarea name="campoTexto" id="campoTexto" cols="60" rows="20" maxlength="10" placeholder="digite aqui"></textarea >
        <!-- LIMITAÇÃO DE CARACTERES com o atributo maxlength -->

    </form>
    
</body>
</html>
