<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <form >

        <fieldset>
            <legend>Informações pessoais</legend>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="digite seu nome aqui">
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="digite seu email aqui">
            <br>
            <label for="genero">Genero</label>
            <br>
            <input type="radio" name="genero" id="masculino" value="masculino" >
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="feminino" value="feminino">
            <label for="feminino">Feminino</label>
            <input type="radio" name="genero" id="outro" value="prefiro não informar">
            <label for="outro">prefiro não informar</label>
            <br>
        </fieldset>

        <fieldset>
            <legend>Informações de interesse da Vaga</legend>
            <label for="unidade">Unidade de interesse</label>
            <br>
            <input type="checkbox" name="unidade" id="fortaleza" value="fortaleza">
            <label for="fortaleza">Fortaleza</label>
            <input type="checkbox" name="unidade" id="caucaia" value="caucaia">
            <label for="caucaia">Caucaia</label>
            <input type="checkbox" name="unidade" id="eusebio" value="eusebio">
            <label for="eusebio">Eusebio</label>
            <br>
            <label for="">Vaga desejada</label>
             <select name="" id="">
                <option value="pessoa desenvolvedora"> pessoa desenvolvedora</option>
                <option value="analista de sistemas"> analista de sistemas</option>
                <option value="administrador(a) de banco de dados">administrador(a) de banco de dados</option>
                <option value="testador(a)">testador(a)</option>
            </select>
            <br>
            <label for="descricao">Descreva-se brevemente para a vaga</label>
            <br>
            <textarea name="descricao" id="descricao" cols="30" rows="10" maxlength="1000"></textarea>
            <br>
            
            <input type="submit" value="enviar candidatura">
        </fieldset>


    </form>
    

<!-- crie um formulário que irá coletar as seguintes informações:
 nome
 email
 genero (só poderá ser selecionado uma opção)
 masculino
 feminino
 preferir não informar
 unidade de interesse (poderá ser selecionada mais de uma opção)
 Fortaleza 
 Caucaia
 Eusebio
-->
