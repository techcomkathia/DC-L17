<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 21 - Vitrine de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== CABEÇALHO DA LOJA ===== -->
  <header class="cabecalho">
    <!-- TAREFA 1: troque o nome da loja abaixo pelo nome que você quiser -->
    <h1 class="cabecalho-titulo">Minha Loja</h1>
    <p class="cabecalho-subtitulo">Os melhores produtos para você</p>
  </header>

  <main>
    <h2 class="vitrine-titulo">Destaques da semana</h2>

    <!-- ===== VITRINE ===== -->
    <!-- Fica vazia aqui: os cards são criados pelo script.js
         a partir do array de produtos -->
    <section class="vitrine"></section>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="rodape">
    <!-- TAREFA 5: coloque seu nome no rodapé -->
    <p>Feito por: ______</p>
  </footer>

  <!-- O script fica no final para o HTML já estar carregado -->
  <script src="script.js"></script>
</body>
</html>
