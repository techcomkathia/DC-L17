<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 21 - Vitrine de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== CABEÇALHO DA LOJA ===== -->
  <header class="cabecalho">
    <!-- TAREFA 1: troque o nome da loja abaixo pelo nome que você quiser -->
    <h1 class="cabecalho-titulo">Magazine Cleitinho</h1>
    <p class="cabecalho-subtitulo">Os melhores produtos para você</p>
  </header>

  <main>
    <h2 class="vitrine-titulo">Destaques da semana</h2>

    <!-- ===== VITRINE: todos os cards ficam aqui dentro ===== -->
    <section class="vitrine">

      <!-- ===== CARD DE EXEMPLO (completo) ===== -->
      <!-- Use este card como modelo para criar os seus! -->
      <article class="card">
        <span class="selo">Novo</span>

        <img class="card-imagem"
             src="https://picsum.photos/seed/fone/400/300"
             alt="Fone de ouvido">

        <div class="card-conteudo">
          <p class="card-categoria">Eletrônicos</p>
          <h3 class="card-titulo">Fone de Ouvido Bluetooth</h3>
          <p class="card-descricao">
            Som de alta qualidade, bateria de 20 horas e cancelamento de ruído.
          </p>

          <div class="card-precos">
            <span class="preco-antigo">R$ 299,90</span>
            <span class="preco">R$ 199,90</span>
          </div>

          <button class="botao">Comprar</button>
        </div>
      </article>

      <!-- ===== CARD 2 (incompleto) ===== -->
      <!-- TAREFA 2: complete este card com categoria, descrição e preço -->
      <article class="card">
        <img class="card-imagem"
             src="https://picsum.photos/seed/mochila/400/300"
             alt="Mochila">

        <div class="card-conteudo">
          <h3 class="card-titulo"></h3>

          <p class="card-categoria"></p>
          <h3 class="card-titulo"></h3>
          <p class="card-descricao">
            
          </p>

          <div class="card-precos">
            <span class="preco-antigo"></span>
            <span class="preco"></span>
          </div>

          <button class="botao">Comprar</button>
        </div>
      </article>

      <!-- ===== CARD 3 (vazio) ===== -->
      <!-- TAREFA 3: crie um card novo do zero aqui embaixo -->


    </section>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="rodape">
    <!-- TAREFA 5: coloque seu nome no rodapé -->
    <p>Feito por: ______</p>
  </footer>

</body>
</html>
